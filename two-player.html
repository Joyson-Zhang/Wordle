<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Player Wordle</title>
  <style>
    :root {
      --bg: #f4f5f0;
      --panel: #ffffff;
      --panel-active: #f8fbff;
      --text: #20242b;
      --muted: #65707c;
      --border: #c8ced7;
      --border-strong: #2f3946;
      --empty: #ffffff;
      --green: #3f7f58;
      --yellow: #b59b35;
      --gray: #6b7280;
      --key: #d8dde5;
      --key-hover: #c9d0da;
      --accent: #2f6690;
      --danger: #a63446;
      --shadow: 0 18px 44px rgba(25, 32, 41, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(63, 127, 88, 0.11), transparent 30%),
        linear-gradient(315deg, rgba(47, 102, 144, 0.14), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px 16px;
    }

    main {
      width: min(100%, 1120px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 2px solid rgba(32, 36, 43, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 2.4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    button {
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid rgba(47, 102, 144, 0.35);
      outline-offset: 2px;
    }

    #timer {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      height: 42px;
      border: 2px solid var(--border-strong);
      border-radius: 6px;
      background: var(--panel);
      font-size: 1.1rem;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(25, 32, 41, 0.08);
    }

    #restart {
      min-width: 90px;
      height: 42px;
      padding: 0 15px;
      background: var(--text);
      color: white;
      align-self: end;
    }

    #settings {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
      border: 2px solid rgba(32, 36, 43, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 12px 32px rgba(25, 32, 41, 0.08);
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      padding: 8px 10px;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(47, 102, 144, 0.28);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    #match-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-item {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 10px 26px rgba(25, 32, 41, 0.08);
      font-weight: 800;
      text-align: center;
    }

    #message {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
    }

    #message.strong {
      color: var(--text);
      font-weight: 800;
    }

    #message.error {
      color: var(--danger);
      font-weight: 800;
    }

    #players {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 18px;
      border: 2px solid rgba(32, 36, 43, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 32px rgba(25, 32, 41, 0.08);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .player.active {
      border-color: var(--accent);
      background: var(--panel-active);
      transform: translateY(-2px);
    }

    .player.finished {
      opacity: 0.82;
    }

    .player-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .attempts {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      width: min(100%, 330px);
      aspect-ratio: var(--word-length, 5) / 6.45;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(var(--word-length, 5), 1fr);
      gap: 8px;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--empty);
      color: var(--text);
      font-size: clamp(1.3rem, 5vw, 2.05rem);
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      user-select: none;
      box-shadow: 0 8px 18px rgba(27, 31, 36, 0.07);
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .tile.filled {
      border-color: #87919f;
      transform: scale(1.02);
    }

    .tile.flip {
      animation: flipTile 520ms ease forwards;
    }

    .tile.correct,
    .tile.present,
    .tile.absent {
      border-color: transparent;
      color: white;
    }

    .tile.correct {
      background: var(--green);
    }

    .tile.present {
      background: var(--yellow);
    }

    .tile.absent {
      background: var(--gray);
    }

    .keyboard {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .player:not(.active) .keyboard {
      opacity: 0.54;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key {
      min-width: 0;
      flex: 1;
      height: 45px;
      padding: 0 4px;
      background: var(--key);
      font-size: 0.86rem;
      text-transform: uppercase;
      border-radius: 6px;
    }

    .key:hover {
      background: var(--key-hover);
    }

    .key.wide {
      flex: 1.55;
      font-size: 0.72rem;
    }

    .key.correct,
    .key.present,
    .key.absent {
      color: white;
    }

    .key.correct {
      background: var(--green);
    }

    .key.present {
      background: var(--yellow);
    }

    .key.absent {
      background: var(--gray);
    }

    .row.shake {
      animation: shakeRow 360ms ease;
    }

    #history-panel {
      padding: 16px;
      border: 2px solid rgba(32, 36, 43, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 12px 32px rgba(25, 32, 41, 0.08);
    }

    #history-panel h2 {
      margin-bottom: 10px;
    }

    #history {
      margin: 0;
      padding-left: 22px;
      color: var(--muted);
      font-weight: 700;
    }

    #history li + li {
      margin-top: 6px;
    }

    @keyframes flipTile {
      0% {
        transform: rotateX(0);
      }
      48% {
        transform: rotateX(90deg);
      }
      52% {
        transform: rotateX(90deg);
      }
      100% {
        transform: rotateX(0);
      }
    }

    @keyframes shakeRow {
      0%, 100% {
        transform: translateX(0);
      }
      20%, 60% {
        transform: translateX(-7px);
      }
      40%, 80% {
        transform: translateX(7px);
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 18px 10px;
      }

      header {
        grid-template-columns: 1fr;
        justify-items: stretch;
      }

      #timer,
      #restart {
        width: 100%;
      }

      #settings,
      #match-summary {
        grid-template-columns: 1fr;
      }

      #players {
        grid-template-columns: 1fr;
      }

      .player {
        padding: 14px 10px;
      }

      .board {
        width: min(100%, 315px);
        gap: 6px;
      }

      .row {
        gap: 6px;
      }

      .key {
        height: 42px;
        padding: 0 3px;
        font-size: 0.78rem;
      }

      .key.wide {
        font-size: 0.68rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Two-Player Wordle</h1>
      <div id="timer" aria-live="polite">30s</div>
    </header>

    <section id="settings" aria-label="Match settings">
      <label for="turn-seconds">
        Turn time
        <input id="turn-seconds" type="number" min="5" max="300" value="30" inputmode="numeric">
      </label>

      <label for="word-length">
        Word length
        <select id="word-length">
          <option value="5" selected>5</option>
          <option value="6">6</option>
        </select>
      </label>

      <label for="wins-to-match">
        Wins to match
        <input id="wins-to-match" type="number" min="2" max="6" value="2" inputmode="numeric">
      </label>

      <button id="restart" type="button">Apply / Restart Match</button>
    </section>

    <section id="match-summary" aria-label="Match summary">
      <div id="round-label" class="summary-item">Round 1</div>
      <div id="score" class="summary-item">Player 1: 0 | Player 2: 0</div>
    </section>

    <div id="message" aria-live="polite">Player 1's turn.</div>

    <section id="players" aria-label="Two-player Wordle game">
      <article class="player" data-player="0">
        <div class="player-header">
          <h2>Player 1</h2>
          <div class="attempts" data-attempts="0">0 / 6 guesses</div>
        </div>
        <section class="board" data-board="0" aria-label="Player 1 board"></section>
        <section class="keyboard" data-keyboard="0" aria-label="Player 1 keyboard"></section>
      </article>

      <article class="player" data-player="1">
        <div class="player-header">
          <h2>Player 2</h2>
          <div class="attempts" data-attempts="1">0 / 6 guesses</div>
        </div>
        <section class="board" data-board="1" aria-label="Player 2 board"></section>
        <section class="keyboard" data-keyboard="1" aria-label="Player 2 keyboard"></section>
      </article>
    </section>

    <section id="history-panel" aria-label="Round history">
      <h2>Round History</h2>
      <ol id="history">
        <li>No rounds yet.</li>
      </ol>
    </section>
  </main>

  <script>
    const WORD_BANKS = {
      5: [
        "apple", "baker", "cider", "delta", "eagle",
        "flame", "grape", "house", "ivory", "joker",
        "knife", "lemon", "mango", "night", "ocean",
        "piano", "queen", "river", "stone", "table",
        "unity", "vivid", "waltz", "xenon", "youth", "zebra"
      ],
      6: [
        "planet", "silver", "castle", "orange", "garden",
        "stream", "bridge", "flower", "rocket", "summer",
        "winter", "little", "forest", "animal", "bright",
        "future", "circle", "travel", "wonder", "school",
        "friend", "yellow", "purple", "camera", "market", "letter"
      ]
    };

    const PLAYER_COUNT = 2;
    const MAX_ATTEMPTS = 6;
    const MIN_TURN_SECONDS = 5;
    const MAX_TURN_SECONDS = 300;
    const MIN_WINS_TO_MATCH = 2;
    const MAX_WINS_TO_MATCH = 6;
    const KEY_ROWS = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
    const STATUS_RANK = { absent: 1, present: 2, correct: 3 };

    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");
    const timerDisplay = document.getElementById("timer");
    const turnSecondsInput = document.getElementById("turn-seconds");
    const wordLengthSelect = document.getElementById("word-length");
    const winsToMatchInput = document.getElementById("wins-to-match");
    const roundLabel = document.getElementById("round-label");
    const scoreDisplay = document.getElementById("score");
    const historyList = document.getElementById("history");
    const playerPanels = Array.from(document.querySelectorAll(".player"));
    const boards = Array.from(document.querySelectorAll(".board"));
    const keyboards = Array.from(document.querySelectorAll(".keyboard"));
    const attemptLabels = Array.from(document.querySelectorAll("[data-attempts]"));

    let settings = {
      turnSeconds: 30,
      wordLength: 5,
      winsToMatch: 2
    };
    let answer = "";
    let activePlayer = 0;
    let roundOver = false;
    let matchOver = false;
    let inputLocked = false;
    let secondsLeft = settings.turnSeconds;
    let timerId = null;
    let players = [];
    let sharedKeyStatuses = {};
    let matchScores = [0, 0];
    let roundNumber = 1;
    let roundHistory = [];
    let matchId = 0;

    function createPlayerState() {
      return {
        currentGuess: "",
        currentRow: 0
      };
    }

    function startMatch() {
      pauseTimer();
      matchId += 1;
      settings = readSettings();
      matchScores = [0, 0];
      roundHistory = [];
      roundNumber = 1;
      matchOver = false;
      renderHistory();
      startRound("Round 1. Player 1's turn.");
    }

    function readSettings() {
      const turnSeconds = clampNumber(
        Number(turnSecondsInput.value),
        MIN_TURN_SECONDS,
        MAX_TURN_SECONDS,
        30
      );
      const wordLength = Number(wordLengthSelect.value) === 6 ? 6 : 5;
      const winsToMatch = clampNumber(
        Number(winsToMatchInput.value),
        MIN_WINS_TO_MATCH,
        MAX_WINS_TO_MATCH,
        2
      );

      turnSecondsInput.value = turnSeconds;
      wordLengthSelect.value = String(wordLength);
      winsToMatchInput.value = winsToMatch;

      return { turnSeconds, wordLength, winsToMatch };
    }

    function clampNumber(value, min, max, fallback) {
      if (!Number.isFinite(value)) {
        return fallback;
      }

      return Math.min(max, Math.max(min, Math.round(value)));
    }

    function startRound(text) {
      answer = chooseAnswer();
      activePlayer = 0;
      roundOver = false;
      inputLocked = false;
      players = Array.from({ length: PLAYER_COUNT }, createPlayerState);
      sharedKeyStatuses = {};
      secondsLeft = settings.turnSeconds;
      document.documentElement.style.setProperty("--word-length", settings.wordLength);

      buildBoards();
      buildKeyboards();
      updateAttempts();
      updateMatchSummary();
      setActivePlayer(0, text);
    }

    function chooseAnswer() {
      const words = WORD_BANKS[settings.wordLength];
      return words[Math.floor(Math.random() * words.length)].toUpperCase();
    }

    function buildBoards() {
      boards.forEach((board, playerIndex) => {
        board.innerHTML = "";

        for (let rowIndex = 0; rowIndex < MAX_ATTEMPTS; rowIndex++) {
          const row = document.createElement("div");
          row.className = "row";
          row.dataset.player = playerIndex;
          row.dataset.row = rowIndex;

          for (let colIndex = 0; colIndex < settings.wordLength; colIndex++) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.dataset.player = playerIndex;
            tile.dataset.row = rowIndex;
            tile.dataset.col = colIndex;
            row.appendChild(tile);
          }

          board.appendChild(row);
        }
      });
    }

    function buildKeyboards() {
      keyboards.forEach((keyboard, playerIndex) => {
        keyboard.innerHTML = "";

        KEY_ROWS.forEach((letters, rowIndex) => {
          const row = document.createElement("div");
          row.className = "keyboard-row";

          if (rowIndex === 2) {
            row.appendChild(createKey(playerIndex, "Enter", "Enter", true));
          }

          letters.split("").forEach((letter) => {
            row.appendChild(createKey(playerIndex, letter, letter, false));
          });

          if (rowIndex === 2) {
            row.appendChild(createKey(playerIndex, "Backspace", "Del", true));
          }

          keyboard.appendChild(row);
        });
      });
    }

    function createKey(playerIndex, value, label, isWide) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = isWide ? "key wide" : "key";
      button.textContent = label;
      button.dataset.player = playerIndex;
      button.dataset.key = value;
      button.addEventListener("click", () => handleKey(value, playerIndex));
      return button;
    }

    function handleKey(key, keyboardPlayer = activePlayer) {
      if (matchOver || roundOver || inputLocked) {
        return;
      }

      if (keyboardPlayer !== activePlayer) {
        setMessage(`It is Player ${activePlayer + 1}'s turn.`);
        return;
      }

      if (key === "Enter") {
        submitGuess();
        return;
      }

      if (key === "Backspace" || key === "Delete") {
        removeLetter();
        return;
      }

      if (/^[a-zA-Z]$/.test(key)) {
        addLetter(key.toUpperCase());
      }
    }

    function addLetter(letter) {
      const player = players[activePlayer];

      if (player.currentGuess.length >= settings.wordLength) {
        return;
      }

      player.currentGuess += letter;
      updateCurrentRow(activePlayer);
    }

    function removeLetter() {
      const player = players[activePlayer];

      if (player.currentGuess.length === 0) {
        return;
      }

      player.currentGuess = player.currentGuess.slice(0, -1);
      updateCurrentRow(activePlayer);
    }

    function updateCurrentRow(playerIndex) {
      const player = players[playerIndex];

      for (let colIndex = 0; colIndex < settings.wordLength; colIndex++) {
        const tile = getTile(playerIndex, player.currentRow, colIndex);
        const letter = player.currentGuess[colIndex] || "";
        tile.textContent = letter;
        tile.classList.toggle("filled", Boolean(letter));
      }
    }

    function submitGuess() {
      const player = players[activePlayer];

      if (player.currentGuess.length !== settings.wordLength) {
        setMessage("Not enough letters", "error");
        shakeRow(activePlayer, player.currentRow);
        return;
      }

      inputLocked = true;
      pauseTimer();
      const guessingPlayer = activePlayer;
      const submittedGuess = player.currentGuess;
      const currentMatchId = matchId;
      const result = scoreGuess(submittedGuess, answer);
      revealGuess(guessingPlayer, submittedGuess, result);

      if (submittedGuess === answer) {
        player.currentGuess = "";
        setTimeout(() => {
          if (currentMatchId !== matchId) {
            return;
          }

          completeRound(guessingPlayer);
        }, 650);
        return;
      }

      player.currentRow += 1;
      player.currentGuess = "";
      updateAttempts();

      setTimeout(() => {
        if (currentMatchId !== matchId) {
          return;
        }

        if (roundOver || matchOver) {
          return;
        }

        if (isRoundExhausted()) {
          completeRound(null);
          return;
        }

        switchTurn(`Player ${guessingPlayer + 1} guessed ${submittedGuess}.`);
      }, 650);
    }

    function scoreGuess(guess, target) {
      const result = Array(target.length).fill("absent");
      const remaining = {};

      for (let index = 0; index < target.length; index++) {
        if (guess[index] === target[index]) {
          result[index] = "correct";
        } else {
          const targetLetter = target[index];
          remaining[targetLetter] = (remaining[targetLetter] || 0) + 1;
        }
      }

      for (let index = 0; index < target.length; index++) {
        const guessedLetter = guess[index];

        if (result[index] === "correct") {
          continue;
        }

        if (remaining[guessedLetter] > 0) {
          result[index] = "present";
          remaining[guessedLetter] -= 1;
        }
      }

      return result;
    }

    function revealGuess(playerIndex, submittedGuess, result) {
      const player = players[playerIndex];
      const rowIndex = player.currentRow;

      result.forEach((status, colIndex) => {
        const tile = getTile(playerIndex, rowIndex, colIndex);
        const letter = submittedGuess[colIndex];

        setTimeout(() => {
          tile.classList.add("flip", status);
          updateKeyStatus(letter, status);
        }, colIndex * 110);
      });
    }

    function markTimedOutGuess(playerIndex) {
      const player = players[playerIndex];
      const rowIndex = player.currentRow;

      for (let colIndex = 0; colIndex < settings.wordLength; colIndex++) {
        const tile = getTile(playerIndex, rowIndex, colIndex);
        tile.textContent = "";
        tile.classList.remove("filled");
        tile.classList.add("flip", "absent");
      }

      player.currentGuess = "";
      player.currentRow += 1;
      updateAttempts();
    }

    function updateKeyStatus(letter, status) {
      const previous = sharedKeyStatuses[letter];

      if (!previous || STATUS_RANK[status] > STATUS_RANK[previous]) {
        sharedKeyStatuses[letter] = status;
      }

      keyboards.forEach((keyboard) => {
        const key = keyboard.querySelector(`[data-key="${letter}"]`);

        if (key) {
          key.classList.remove("absent", "present", "correct");
          key.classList.add(sharedKeyStatuses[letter]);
        }
      });
    }

    function switchTurn(prefixMessage) {
      const nextPlayer = getNextAvailablePlayer();

      if (nextPlayer === -1) {
        completeRound(null);
        return;
      }

      const nextMessage = `Player ${nextPlayer + 1}'s turn.`;
      setActivePlayer(nextPlayer, prefixMessage ? `${prefixMessage} ${nextMessage}` : nextMessage);
    }

    function getNextAvailablePlayer() {
      for (let offset = 1; offset <= PLAYER_COUNT; offset++) {
        const candidate = (activePlayer + offset) % PLAYER_COUNT;

        if (players[candidate].currentRow < MAX_ATTEMPTS) {
          return candidate;
        }
      }

      return -1;
    }

    function setActivePlayer(playerIndex, text) {
      activePlayer = playerIndex;
      secondsLeft = settings.turnSeconds;
      inputLocked = false;
      updatePanels();
      updateTimerDisplay();
      setMessage(text);
      startTimer();
    }

    function completeRound(winnerIndex) {
      if (roundOver || matchOver) {
        return;
      }

      pauseTimer();
      roundOver = true;
      inputLocked = true;

      if (winnerIndex !== null) {
        matchScores[winnerIndex] += 1;
      }

      recordRound(winnerIndex);

      if (winnerIndex !== null && matchScores[winnerIndex] >= settings.winsToMatch) {
        matchOver = true;
        timerDisplay.textContent = "Done";
        updateMatchSummary();
        updatePanels();
        setMessage(
          `Player ${winnerIndex + 1} won the match ${matchScores[0]}-${matchScores[1]}!`,
          "strong"
        );
        return;
      }

      updateMatchSummary();
      updatePanels();
      const resultText = winnerIndex === null
        ? `Round ${roundNumber} was a draw. The answer was ${answer}.`
        : `Player ${winnerIndex + 1} won round ${roundNumber}. The answer was ${answer}.`;

      setMessage(`${resultText} Next round starting.`, "strong");
      const currentMatchId = matchId;

      setTimeout(() => {
        if (currentMatchId !== matchId || matchOver) {
          return;
        }

        roundNumber += 1;
        startRound(`Round ${roundNumber}. Player 1's turn.`);
      }, 1500);
    }

    function recordRound(winnerIndex) {
      const result = winnerIndex === null ? "Draw" : `Player ${winnerIndex + 1} won`;
      roundHistory.push({
        number: roundNumber,
        result,
        answer,
        score: [...matchScores]
      });
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = "";

      if (roundHistory.length === 0) {
        const item = document.createElement("li");
        item.textContent = "No rounds yet.";
        historyList.appendChild(item);
        return;
      }

      roundHistory.forEach((round) => {
        const item = document.createElement("li");
        item.textContent = `Round ${round.number}: ${round.result} - ${round.answer} (P1 ${round.score[0]}, P2 ${round.score[1]})`;
        historyList.appendChild(item);
      });
    }

    function updateMatchSummary() {
      roundLabel.textContent = matchOver ? "Match complete" : `Round ${roundNumber}`;
      scoreDisplay.textContent = `Player 1: ${matchScores[0]} | Player 2: ${matchScores[1]} | First to ${settings.winsToMatch}`;
    }

    function updatePanels() {
      playerPanels.forEach((panel, playerIndex) => {
        panel.classList.toggle("active", playerIndex === activePlayer && !roundOver && !matchOver);
        panel.classList.toggle("finished", players[playerIndex].currentRow >= MAX_ATTEMPTS);
      });
    }

    function updateAttempts() {
      attemptLabels.forEach((label, playerIndex) => {
        const guesses = players[playerIndex].currentRow;
        label.textContent = `${guesses} / ${MAX_ATTEMPTS} guesses`;
      });
      updatePanels();
    }

    function isRoundExhausted() {
      return players.every((player) => player.currentRow >= MAX_ATTEMPTS);
    }

    function startTimer() {
      pauseTimer();

      if (roundOver || matchOver) {
        return;
      }

      timerId = setInterval(() => {
        secondsLeft -= 1;
        updateTimerDisplay();

        if (secondsLeft <= 0) {
          handleTimeout();
        }
      }, 1000);
    }

    function pauseTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function updateTimerDisplay() {
      timerDisplay.textContent = `${secondsLeft}s`;
    }

    function handleTimeout() {
      if (matchOver || roundOver) {
        return;
      }

      inputLocked = true;
      pauseTimer();
      const timedOutPlayer = activePlayer;
      markTimedOutGuess(timedOutPlayer);

      if (isRoundExhausted()) {
        completeRound(null);
        return;
      }

      switchTurn(`Player ${timedOutPlayer + 1} ran out of time and lost a guess.`);
    }

    function getTile(playerIndex, row, col) {
      return boards[playerIndex].querySelector(`[data-row="${row}"][data-col="${col}"]`);
    }

    function shakeRow(playerIndex, rowIndex) {
      const row = boards[playerIndex].querySelector(`[data-row="${rowIndex}"]`);
      row.classList.remove("shake");
      void row.offsetWidth;
      row.classList.add("shake");
    }

    function setMessage(text, tone) {
      message.textContent = text;
      message.className = tone || "";
    }

    document.addEventListener("keydown", (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }

      handleKey(event.key);
    });

    restartButton.addEventListener("click", startMatch);
    startMatch();
  </script>
</body>
</html>
